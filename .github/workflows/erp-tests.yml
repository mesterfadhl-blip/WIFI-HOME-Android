name: ERP accounting checks
on:
  push:
    paths: ['erp/**', 'tests/**', '.github/workflows/erp-tests.yml']
  pull_request:
    paths: ['erp/**', 'tests/**', '.github/workflows/erp-tests.yml']
permissions:
  contents: read
jobs:
  accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_erp*.py' -v
