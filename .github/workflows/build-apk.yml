name: Build WIFI-HOME APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore WIFI-HOME application
        run: |
          cat app/src/main/assets/.parts/* > /tmp/wifihome.b64
          base64 -d /tmp/wifihome.b64 > /tmp/wifihome.html.gz
          gzip -dc /tmp/wifihome.html.gz > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          grep -q "WIFI-HOME" app/src/main/assets/index.html
          echo "Application payload restored: $(wc -c < app/src/main/assets/index.html) bytes"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk WIFI-HOME.apk
          ls -lh WIFI-HOME.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WIFI-HOME-APK
          path: WIFI-HOME.apk
          if-no-files-found: error
          retention-days: 30
