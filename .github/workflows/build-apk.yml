name: Build WIFI-HOME APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify application asset
        run: |
          test -s app/src/main/assets/index.html
          grep -q "WIFI-HOME" app/src/main/assets/index.html
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk WIFI-HOME.apk
          ls -lh WIFI-HOME.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WIFI-HOME-APK
          path: WIFI-HOME.apk
          if-no-files-found: error
          retention-days: 30
