<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WIFI HOME — نسخة الهاتف المحلية</title>
    <style>:root {
  font-family: Tahoma, Arial, sans-serif;
  color: #162b43;
  background: #f5f7fa;
  font-size: 14px;
  --line: #e0e7ef;
  --brand: #176b63;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  display: flex;
  min-height: 100vh;
}
aside {
  width: 230px;
  background: #122b42;
  color: white;
  padding: 30px 18px;
  position: fixed;
  inset: 0 0 0 auto;
  display: flex;
  flex-direction: column;
}
.brand {
  font-size: 25px;
  font-weight: bold;
  color: #fff;
  text-decoration: none;
  direction: ltr;
  text-align: center;
  letter-spacing: 1px;
}
.brand span {
  color: #74d2bc;
}
.brand small {
  display: block;
  font-size: 12px;
  margin-top: 10px;
  letter-spacing: 0;
  color: #bacbd8;
}
nav {
  display: grid;
  gap: 7px;
  margin-top: 36px;
}
nav a {
  color: #c9d7e2;
  text-decoration: none;
  padding: 13px 16px;
  border-radius: 8px;
  font-weight: bold;
}
nav a.active,
nav a:hover {
  color: white;
  background: #24536a;
}
.local {
  font-size: 11px;
  line-height: 1.9;
  color: #adc3d4;
  margin-top: auto;
  padding-top: 24px;
}
main {
  margin-right: 230px;
  width: calc(100% - 230px);
  padding: 26px 34px;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 26px;
}
h1 {
  font-size: 25px;
  margin: 7px 0;
}
h2 {
  font-size: 17px;
  margin: 0 0 16px;
}
h3 {
  font-size: 15px;
}
.head-actions,
.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
small,
.muted {
  color: #62788b;
  font-size: 12px;
  line-height: 1.8;
}
button,
.button {
  background: var(--brand);
  color: white;
  border: 1px solid transparent;
  padding: 11px 16px;
  border-radius: 7px;
  cursor: pointer;
  font: inherit;
  text-decoration: none;
  display: inline-block;
}
button.secondary,
.button.secondary {
  background: white;
  color: #25435a;
  border-color: var(--line);
}
button.danger {
  color: #a12c3c;
  background: #fff2f3;
  border-color: #f4d8dc;
}
button.link {
  background: transparent;
  color: var(--brand);
  padding: 5px;
  border: 0;
}
button:disabled {
  opacity: 0.45;
  cursor: wait;
}
.card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 22px;
  margin-bottom: 18px;
}
.kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.kpi {
  padding: 19px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.kpi strong {
  display: block;
  font-size: 26px;
  margin: 10px 0;
  color: #153f4c;
}
.kpi span {
  font-size: 12px;
  color: #62788b;
}
.filters,
.form-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  align-items: end;
}
.form-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
label {
  display: block;
  color: #415a70;
  font-size: 12px;
  margin-bottom: 7px;
}
input,
select,
textarea {
  font: inherit;
  padding: 11px;
  width: 100%;
  border: 1px solid #cad6e1;
  border-radius: 7px;
  background: white;
  color: #162b43;
}
input:focus,
select:focus,
textarea:focus {
  outline: 2px solid #92c9bd;
  outline-offset: 1px;
}
textarea {
  resize: vertical;
  min-height: 70px;
}
.table-wrap {
  overflow: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  text-align: right;
  white-space: nowrap;
}
th {
  background: #f4f7fa;
  color: #566f83;
  font-size: 12px;
}
td,
th {
  padding: 13px 11px;
  border-bottom: 1px solid #e9eef3;
  vertical-align: middle;
}
td small {
  display: block;
}
.empty {
  text-align: center;
  color: #738498;
  padding: 38px;
}
.pill {
  border-radius: 20px;
  padding: 5px 9px;
  font-size: 11px;
  background: #e5f4ed;
  color: #237753;
}
.pill.bad {
  background: #fcebed;
  color: #a12c3c;
}
.bad {
  color: #b23848;
}
.good {
  color: #16795b;
}
.note {
  background: #eaf4f3;
  padding: 14px;
  border-radius: 8px;
  line-height: 1.9;
  margin-bottom: 15px;
}
.warn {
  background: #fff6e4;
  color: #805619;
}
.split {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.two {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 18px;
}
.summary {
  max-width: 420px;
  margin-right: auto;
}
.summary div {
  display: flex;
  justify-content: space-between;
  padding: 12px;
  border-bottom: 1px solid var(--line);
}
.summary .total {
  font-size: 20px;
  font-weight: bold;
  background: #edf6f3;
}
.invoice {
  max-width: 980px;
  margin: auto;
}
.invoice-top {
  border-bottom: 3px solid #176b63;
  padding-bottom: 20px;
  display: flex;
  justify-content: space-between;
}
.invoice-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin: 25px 0;
}
.invoice-meta b {
  display: block;
  margin: 8px 0;
}
.items input {
  min-width: 90px;
}
.items select {
  min-width: 220px;
}
.bar {
  height: 9px;
  background: #edf1f5;
  border-radius: 10px;
  margin: 8px 0 16px;
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  background: #36a28b;
}
.error,
.success {
  padding: 13px 18px;
  margin-bottom: 18px;
  border-radius: 8px;
  background: #fff0f0;
  color: #972639;
}
.success {
  background: #e4f4ec;
  color: #17664c;
}
.formula {
  line-height: 2;
  border-right: 3px solid #4b9d8b;
  padding: 8px 14px;
  background: #f7faf9;
  margin-top: 14px;
}
footer {
  font-size: 11px;
  color: #7a8998;
  padding-top: 25px;
  line-height: 1.8;
}
dialog {
  border: 1px solid var(--line);
  border-radius: 14px;
  width: min(600px, 95vw);
  padding: 25px;
  max-height: 90vh;
}
dialog::backdrop {
  background: #152c4280;
}
dialog .form-grid {
  margin-bottom: 20px;
}
.stack > * {
  margin-bottom: 13px;
}
.screen-actions {
  margin-bottom: 20px;
}
input[type="file"] {
  font-size: 12px;
}
a {
  color: #176b63;
}
.chart-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
.subnav {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.subnav button {
  background: #fff;
  color: #34546b;
  border-color: var(--line);
}
.subnav button.active {
  background: #176b63;
  color: #fff;
}
.number {
  font-variant-numeric: tabular-nums;
}
.tiny {
  font-size: 11px;
}
@media (max-width: 1000px) {
  aside {
    width: 185px;
  }
  main {
    margin-right: 185px;
    width: calc(100% - 185px);
    padding: 22px;
  }
  .kpis {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .filters {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .two {
    grid-template-columns: 1fr;
  }
}
@media (max-width: 650px) {
  body {
    display: block;
  }
  aside {
    position: sticky;
    top: 0;
    z-index: 20;
    inset: auto;
    width: 100%;
    padding: 12px;
    display: block;
  }
  .brand {
    font-size: 19px;
    display: block;
    text-align: right;
  }
  .brand small,
  .local {
    display: none;
  }
  nav {
    display: flex;
    overflow: auto;
    gap: 3px;
    margin-top: 12px;
  }
  nav a {
    padding: 9px;
    white-space: nowrap;
    font-size: 12px;
  }
  main {
    margin: 0;
    width: 100%;
    padding: 16px 12px;
  }
  header {
    align-items: start;
  }
  h1 {
    font-size: 21px;
  }
  .head-actions {
    justify-content: end;
  }
  .head-actions button {
    padding: 9px;
    font-size: 12px;
  }
  .card {
    padding: 15px;
  }
  .kpis {
    gap: 9px;
  }
  .kpi {
    padding: 13px;
  }
  .kpi strong {
    font-size: 22px;
  }
  .form-grid {
    grid-template-columns: 1fr;
  }
  .invoice-meta {
    grid-template-columns: 1fr;
  }
  .items select {
    min-width: 175px;
  }
  .split {
    flex-wrap: wrap;
  }
  .summary {
    max-width: none;
  }
  .filters {
    gap: 8px;
  }
}
@media print {
  aside,
  header,
  footer,
  .screen-actions,
  .no-print,
  #notice {
    display: none !important;
  }
  main {
    width: 100%;
    margin: 0;
    padding: 0;
    background: white;
  }
  .card {
    border: 0;
    box-shadow: none;
  }
  .table-wrap {
    overflow: visible;
  }
  table {
    white-space: normal;
    font-size: 11px;
  }
  body {
    background: white;
    display: block;
  }
  .two {
    display: block;
  }
  a,
  button {
    display: none !important;
  }
  .kpi {
    break-inside: avoid;
  }
  tr {
    break-inside: avoid;
  }
}

.offline-status {
  padding: 12px 16px;
  border: 1px solid #d8e4e0;
  border-radius: 12px;
  margin: 0 0 16px;
  background: #edf9f2;
  color: #185438;
  line-height: 1.8;
}
.offline-status.warn {
  background: #fff0cf;
  color: #624500;
  border-color: #e6cc8e;
}
.offline-status b {
  display: block;
}
.offline-doc {
  position: fixed;
  inset: 10px;
  width: calc(100% - 20px);
  height: calc(100% - 20px);
  max-width: none;
  max-height: none;
  padding: 0;
  border: 1px solid #ddd;
  border-radius: 12px;
}
.offline-doc iframe {
  border: 0;
  width: 100%;
  height: calc(100% - 70px);
  background: white;
}
.offline-doc .actions {
  padding: 10px;
  background: #f1f5f7;
  margin: 0;
}
.offline-help {
  line-height: 1.9;
}
.head-actions {
  flex-wrap: wrap;
}
button:disabled {
  opacity: 0.55;
  cursor: wait;
}
@media (max-width: 650px) {
  header {
    align-items: flex-start;
    gap: 10px;
  }
  .head-actions button {
    padding: 9px;
    font-size: 12px;
  }
  aside {
    position: static !important;
    inset: auto !important;
  }
  nav {
    overflow: auto;
  }
  nav a {
    white-space: nowrap;
  }
  .invoice-meta {
    grid-template-columns: 1fr;
  }
  .invoice {
    padding: 16px;
  }
  .form-grid input,
  .form-grid select {
    max-width: 100%;
  }
}
@media print {
  .offline-status {
    display: none !important;
  }
}

  <body>

      <a class="brand" href="#home"

      >

          <h1 id="title"></h1>

          ><button id="new-sale">+ فاتورة بيع</button>
        </div>
      </header>
      <div id="notice" role="status"></div>
      <section id="view"></section>
      <footer>
        المبالغ بالريال اليمني · دون ضريبة · نسخة تشغيل محلية على هذا الجهاز؛ احفظ نسخة احتياطية خارج المتصفح
      </footer>

    <script id="offline-seed" type="application/json">{}</script><script>(function(){"use strict";

const offlineSeed=JSON.parse(document.getElementById('offline-seed').textContent);
const OFFLINE_KEY=offlineSeed.storageKey||'wifiHomeERP.offline.v2';
if(!globalThis.structuredClone)globalThis.structuredClone=value=>JSON.parse(JSON.stringify(value));
function recordID(){
 if(globalThis.crypto?.randomUUID)return globalThis.crypto.randomUUID();
 if(globalThis.crypto?.getRandomValues){const a=globalThis.crypto.getRandomValues(new Uint8Array(16));return [...a].map(x=>x.toString(16).padStart(2,'0')).join('');}
 return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+(++recordID.sequence);
}recordID.sequence=0;
let storage,temporaryStorage=false;
try{storage=window.localStorage;const probe='erp-probe-'+Date.now();storage.setItem(probe,'1');storage.removeItem(probe);}
catch(error){temporaryStorage=true;const memory=new Map();storage={getItem:key=>memory.get(key)??null,setItem:(key,value)=>memory.set(key,String(value)),removeItem:key=>memory.delete(key)};}
const round = (n) =>
  Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const number = (v, label) => {
  const n = Number(v);
  if (!Number.isFinite(n) || n < 0) throw Error("قيمة غير صحيحة: " + label);
  return n;
};
const active = (s) => s.status !== "ملغاة";
const day = (value) => String(value || "").slice(0, 10);
function emptyDB() {
  return {
    customers: [],
    products: [],
    sales: [],
    receipts: [],
    expenses: [],
    journal: [],
    stockMoves: [],
    audit: [],
    dailyClosings: [],
    seq: { sale: 1, customer: 1, product: 1, receipt: 1, expense: 1 },
    settings: { company: "واي فاي هوم" },
  };
}
function normalize(input) {
  if (
    !input ||
    !Array.isArray(input.customers) ||
    !Array.isArray(input.products) ||
    !Array.isArray(input.sales)
  )
    throw Error("الملف لا يحتوي قاعدة بيانات عملاء وأصناف وفواتير صالحة");
  const db = structuredClone(input);
  for (const key of [
    "customers",
    "products",
    "sales",
    "receipts",
    "expenses",
    "journal",
    "stockMoves",
    "audit",
    "dailyClosings",
  ]) {
    if (db[key] === undefined) db[key] = [];
    if (!Array.isArray(db[key])) throw Error("بيانات غير صالحة: " + key);
  }
  db.seq = { ...emptyDB().seq, ...db.seq };
  db.settings = { ...emptyDB().settings, ...db.settings };
  return db;
}
function balance(db, cid) {
  return round(
    db.journal
      .filter((j) => j.account === "العملاء" && j.customerId === cid)
      .reduce((n, j) => n + Number(j.debit || 0) - Number(j.credit || 0), 0),
  );
}
function cash(db) {
  return round(
    db.journal
      .filter((j) => j.account === "الصندوق")
      .reduce((n, j) => n + Number(j.debit || 0) - Number(j.credit || 0), 0),
  );
}
function dateCheck(db, date) {
  if (
    !/^\d{4}-\d{2}-\d{2}$/.test(date) ||
    !Number.isFinite(Date.parse(date + "T12:00:00Z")) ||
    new Date(date + "T12:00:00Z").toISOString().slice(0, 10) !== date
  )
    throw Error("التاريخ غير صحيح");
  if (
    db.dailyClosings.some((c) => day(c.date) === date && c.status !== "ملغاة")
  )
    throw Error("اليوم مغلق محاسبياً؛ لا يمكن تعديله");
}
function next(db, key, prefix) {
  let ref;
  do {
    ref = prefix + String(db.seq[key]++).padStart(5, "0");
  } while (
    [...db.sales, ...db.receipts, ...db.expenses].some((x) => x.ref === ref)
  );
  return ref;
}
function entry(db, ref, date, desc, rows) {
  const delta = round(
    rows.reduce((n, r) => n + Number(r.debit || 0) - Number(r.credit || 0), 0),
  );
  if (delta !== 0) throw Error("القيد غير متوازن");
  db.journal.push(
    ...rows.map((r) => ({ ref, date: date + "T12:00:00", desc, ...r })),
  );
}
function audit(db, action, ref, before, after, reason) {
  db.audit.push({
    at: new Date().toISOString(),
    user: "المستخدم المحلي",
    action,
    ref,
    reason,
    before: structuredClone(before || null),
    after: structuredClone(after || null),
  });
}
function reverse(db, s, tag) {
  const posting = s.postingRef || s.ref,
    rows = db.journal.filter((j) => j.ref === posting);
  if (!rows.length)
    throw Error("لا توجد قيود أصلية لهذه الفاتورة؛ يلزم مراجعتها قبل التعديل");
  entry(
    db,
    tag,
    day(s.date),
    "عكس " + posting,
    rows.map((j) => ({
      account: j.account,
      ...(j.customerId ? { customerId: j.customerId } : {}),
      debit: Number(j.credit || 0),
      credit: Number(j.debit || 0),
    })),
  );
  for (const l of s.lines) {
    if (l.service) continue;
    const p = db.products.find((p) => p.id === l.productId);
    if (!p) throw Error("صنف الفاتورة القديم غير موجود");
    const restoredQty = round(Number(p.qty) + Number(l.qty));
    p.cost =
      (Number(p.qty) * Number(p.cost || 0) +
        Number(l.qty) * Number(l.cost || 0)) /
      restoredQty;
    p.qty = restoredQty;
    db.stockMoves.push({
      ref: tag,
      date: s.date,
      productId: p.id,
      qty: Number(l.qty),
      cost: Number(l.cost || 0),
      type: "عكس بيع",
    });
  }
}
function saveInvoice(input, draft, editRef = null) {
  const db = normalize(input),
    old = editRef ? db.sales.find((s) => s.ref === editRef) : null;
  if (editRef && !old) throw Error("الفاتورة غير موجودة");
  if (old && !active(old)) throw Error("لا يمكن تعديل فاتورة ملغاة");
  dateCheck(db, draft.date);
  if (old) {
    dateCheck(db, day(old.date));
    if (!draft.reason?.trim()) throw Error("اكتب سبب تعديل الفاتورة");
  }
  const customer = db.customers.find(
    (c) => c.id === draft.customerId && !c.inactive,
  );
  if (!customer) throw Error("اختر العميل");
  if (!Array.isArray(draft.lines) || !draft.lines.length)
    throw Error("أضف بنداً واحداً على الأقل");
  const revision = old ? Number(old.revision || 1) + 1 : 1;
  if (old) reverse(db, old, `${old.ref}-REV-${revision}`);
  const used = {};
  const lines = draft.lines.map((l) => {
    const p = db.products.find((p) => p.id === l.productId && !p.inactive);
    if (!p) throw Error("اختر صنفاً صالحاً");
    const qty = number(l.qty, "الكمية"),
      price = number(l.price, "السعر");
    if (qty <= 0) throw Error("الكمية يجب أن تكون أكبر من صفر");
    used[p.id] = (used[p.id] || 0) + qty;
    if (!p.service && used[p.id] > Number(p.qty))
      throw Error("المخزون غير كافٍ: " + p.name);
    const prior = old?.lines.find((x) => x.productId === p.id);
    return {
      productId: p.id,
      name: p.name,
      qty,
      price,
      cost: number(prior?.cost ?? p.cost ?? 0, "التكلفة"),
      service: !!p.service,
      total: round(qty * price),
    };
  });
  const subtotal = round(lines.reduce((n, l) => n + l.total, 0)),
    discount = number(draft.discount || 0, "الخصم");
  if (discount > subtotal) throw Error("الخصم أكبر من قيمة الفاتورة");
  const total = round(subtotal - discount);
  if (!["cash", "credit", "mixed"].includes(draft.payType))
    throw Error("طريقة الدفع غير صحيحة");
  const paid =
    draft.payType === "cash"
      ? total
      : draft.payType === "credit"

  const rows = [
    { account: "العملاء", customerId: customer.id, debit: total, credit: 0 },

    rows.push(

    );

function report(
  db,
  { from = "", to = "", customerId = "", productId = "" } = {},
) {
  const inside = (x) =>
    (!from || day(x.date) >= from) && (!to || day(x.date) <= to);
  const invoices = db.sales.filter(
    (s) =>
      active(s) &&
      inside(s) &&
      (!customerId || s.customerId === customerId) &&
      (!productId || s.lines.some((l) => l.productId === productId)),
  );
  const rows = invoices.map((s) => {
    const selected = s.lines.filter(
        (l) => !productId || l.productId === productId,
      ),
      gross = selected.reduce(
        (n, l) => n + Number(l.total ?? l.qty * l.price),
        0,
      ),
      share = Number(s.subtotal) ? gross / Number(s.subtotal) : 1,
      net = round(Number(s.total) * share),
      cost = round(
        selected.reduce((n, l) => n + Number(l.qty) * Number(l.cost || 0), 0),
      );
    return {
      ...s,
      net,
      selectedCost: cost,
      units: selected.reduce((n, l) => n + Number(l.qty), 0),
      selectedPaid: round(Number(s.paid) * share),
    };
  });
  const sum = (f) => round(rows.reduce((n, r) => n + f(r), 0)),
    net = sum((r) => r.net),
    cost = sum((r) => r.selectedCost),
    instant = sum((r) => r.selectedPaid),
    receipts = productId
      ? null
      : round(
          db.receipts
            .filter(
              (r) => inside(r) && (!customerId || r.customerId === customerId),
            )
            .reduce((n, r) => n + Number(r.amount), 0),
        );
  const costs =
    customerId || productId
      ? null
      : round(
          db.expenses.filter(inside).reduce((n, r) => n + Number(r.amount), 0),
        );
  return {
    rows,
    net,
    cost,
    grossProfit: round(net - cost),
    margin: net ? round(((net - cost) / net) * 100) : 0,
    instant,
    receipts,
    collections: receipts === null ? null : round(instant + receipts),
    expenses: costs,
    netProfit: costs === null ? null : round(net - cost - costs),
    creditSales: round(net - instant),
    units: sum((r) => r.units),
  };
}
function ledger(db, cid, { from = "", to = "" } = {}) {
  const all = db.journal
    .filter((j) => j.account === "العملاء" && j.customerId === cid)
    .map((j, i) => ({ ...j, order: i }))
    .sort(
      (a, b) =>
        String(a.date).localeCompare(String(b.date)) || a.order - b.order,
    );
  const opening = round(
    all
      .filter((j) => from && day(j.date) < from)
      .reduce((n, j) => n + Number(j.debit || 0) - Number(j.credit || 0), 0),
  );
  let running = opening;
  const rows = all
    .filter((j) => (!from || day(j.date) >= from) && (!to || day(j.date) <= to))
    .map((j) => {
      running = round(running + Number(j.debit || 0) - Number(j.credit || 0));
      return { ...j, balance: running };
    });
  return { opening, rows, closing: running };
}


function cleanOfflineImport(packageData) {
  const input = packageData.database || packageData.data || packageData;
  const source = normalize(input);
  const demoRefs = new Set(["V47-STK"]);
  for (const key of ["sales", "receipts", "expenses", "stockMoves"])
    for (const row of source[key] || [])
      if (row.demo === true && row.ref) demoRefs.add(row.ref);
  const reservedCustomers = {
    "V47-C1": "شركة الأمل - تجربة",
    "V47-C2": "مؤسسة النجاح - تجربة",
  };
  const reservedProducts = {
    "V47-P1": "كرت 100 - تجربة",
    "V47-P2": "كرت 200 - تجربة",
  };
  const customers = new Set(
    source.customers
      .filter((c) => c.demo === true || reservedCustomers[c.id] === c.name)
      .map((c) => c.id),
  );
  const products = new Set(
    source.products
      .filter((p) => p.demo === true || reservedProducts[p.id] === p.name)
      .map((p) => p.id),
  );
  // Do not silently discard actual activity that later used a demo identity.
  for (const s of source.sales)
    if (s.demo !== true && !demoRefs.has(s.ref)) {
      if (
        customers.has(s.customerId) ||
        s.lines.some((l) => products.has(l.productId))
      )
        throw Error(
          "توجد عملية غير تجريبية مرتبطة بسجل تجربة؛ تحتاج مراجعة قبل الاستيراد.",
        );
    }
  for (const j of source.journal)
    if (
      !demoRefs.has(j.ref) &&
      j.demo !== true &&
      j.account === "العملاء" &&
      customers.has(j.customerId)
    )
      throw Error("يوجد رصيد غير تجريبي لعميل تجربة؛ توقف الاستيراد للمراجعة.");
  const db = {
    customers: source.customers.filter((c) => !customers.has(c.id)),
    products: source.products.filter((p) => !products.has(p.id)),
    sales: source.sales.filter((s) => s.demo !== true && !demoRefs.has(s.ref)),
    receipts: source.receipts.filter(
      (r) => r.demo !== true && !demoRefs.has(r.ref),
    ),
    expenses: source.expenses.filter(
      (r) => r.demo !== true && !demoRefs.has(r.ref),
    ),
    journal: source.journal.filter(
      (r) => r.demo !== true && !demoRefs.has(r.ref),
    ),
    stockMoves: source.stockMoves.filter(
      (r) => r.demo !== true && !demoRefs.has(r.ref),
    ),
    audit: packageData.format === "WIFI-HOME-OFFLINE" ? source.audit : [],
    dailyClosings: source.dailyClosings.filter((c) => c.demo !== true),
    settings: source.settings,
    seq: source.seq,
  };
  for (const field of [
    "suppliers",
    "purchases",
    "supplierPayments",
    "purchaseReturns",
  ])
    if (Array.isArray(source[field])) db[field] = source[field];
  const ids = new Set();
  for (const c of db.customers) {
    if (!c.id || !c.name || ids.has(c.id))
      throw Error("اسم أو معرف عميل غير صالح أو مكرر");
    ids.add(c.id);
  }
  const pids = new Set();
  for (const p of db.products) {
    if (
      !p.id ||
      !p.name ||
      pids.has(p.id) ||
      !Number.isFinite(Number(p.qty)) ||
      Number(p.qty) < 0
    )
      throw Error("صنف غير صالح أو رصيد مخزون سالب");
    pids.add(p.id);
  }
  for (const s of db.sales)
    if (!ids.has(s.customerId) || s.lines.some((l) => !pids.has(l.productId)))
      throw Error("الفاتورة مرتبطة بعميل أو صنف مفقود");
  const refs = new Map();
  for (const j of db.journal) {
    for (const k of ["debit", "credit"])
      if (!Number.isFinite(Number(j[k] || 0)) || Number(j[k] || 0) < 0)
        throw Error("مبلغ قيد غير صالح");
    if (j.account === "العملاء" && !ids.has(j.customerId))
      throw Error("قيد مرتبط بعميل مفقود");
    refs.set(
      j.ref,
      round(
        (refs.get(j.ref) || 0) + Number(j.debit || 0) - Number(j.credit || 0),
      ),
    );
  }
  if ([...refs.values()].some((n) => n !== 0))
    throw Error("قيود النسخة غير متوازنة؛ لا يمكن اعتمادها");
  for (const s of db.sales) {
    s.postingRef = s.postingRef || s.ref;
    s.revision = s.revision || 1;
  }
  return {
    db: normalize(db),
    removedCustomers: customers.size,
    removedProducts: products.size,
    removedSales: source.sales.length - db.sales.length,
  };
}

function calc() {
  if (!draft || !$("#invoice-form")) return;
  const subtotal = round(
      draft.lines.reduce((n, l) => n + Number(l.qty) * Number(l.price), 0),
    ),
    total = round(subtotal - Number(draft.discount)),
    paid =
      draft.payType === "cash"
        ? total
        : draft.payType === "credit"
          ? 0
          : Number(draft.paid || 0);
  $("#invoice-form [name=paid]").disabled = draft.payType !== "mixed";
  if (draft.payType !== "mixed") $("#invoice-form [name=paid]").value = paid;
  $("#totals").innerHTML =
    `<div><span>مجموع البنود</span><b>${money(subtotal)}</b></div><div><span>الخصم</span><b>${money(draft.discount)}</b></div><div class="total"><span>صافي الفاتورة</span><b>${money(total)}</b></div><div><span>المسدد</span><b>${money(paid)}</b></div><div><span>آجل عند البيع</span><b>${money(total - paid)}</b></div>`;
  const c = customer(draft.customerId);
  $("#customer-balance").textContent = c
    ? "رصيد العميل الحالي: " +
      money(balance(db, c.id)) +
      " ر.ي (يشمل الفاتورة القديمة عند التعديل)"
    : "";
}

function groups(rows, key) {
  const map = new Map();
  for (const s of rows) {
    const k = key(s);
    const x = map.get(k) || { label: k, net: 0, cost: 0, count: 0 };
    x.net = round(x.net + s.net);
    x.cost = round(x.cost + s.selectedCost);
    x.count++;
    map.set(k, x);
  }
  return [...map.values()].sort((a, b) => b.net - a.net);
}

        ),
    );

    const data = new Map();
    for (const sale of r.rows) {

          name: line.name,
          qty: 0,
          net: 0,
          cost: 0,

    ["مجمل الربح", r.grossProfit, "صافي المبيعات − التكلفة"],

    ["مسدد فواتير الفترة", r.instant, "المسدد عند البيع فقط"],
    [
      "سندات قبض الفترة",
      r.receipts,

function render() {
  const route = decodeURIComponent(location.hash.slice(1) || "home"),
    [page, ref] = route.split("/");
  if (page === "edit" && (!draft || editing !== ref)) {
    editing = ref;
    const sale = db.sales.find((s) => s.ref === ref);
    draft = sale
      ? { ...structuredClone(sale), date: day(sale.date), reason: "" }
      : null;
  }
  $("#title").textContent =
    page === "new"
      ? "فاتورة بيع جديدة"
      : page === "edit"
        ? "تعديل فاتورة"
        : page === "invoice"
          ? "عرض الفاتورة"
          : pages[page] || pages.home;
  $("#nav").innerHTML = Object.entries(pages)
    .map(
      ([k, v]) =>
        `<a href="#${k}" class="${k === page || (k === "sales" && ["new", "edit", "invoice"].includes(page)) ? "active" : ""}">${v}</a>`,
    )
    .join("");
  $("#view").innerHTML = (
    { home, sales, customers, inventory, cash: cashPage, reports, settings }[
      page

    (["new", "edit"].includes(page)
      ? editor
      : page === "invoice"
        ? () => invoiceView(ref)

}
function download(filename, text, type = "application/json") {
  const url = URL.createObjectURL(new Blob([text], { type })),
    a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function backup() {
  download(
    "WIFI-HOME-ERP-" + today() + ".json",
    JSON.stringify(
      {
        format: "WIFI-HOME-ERP",
        version: 1,
        createdAt: new Date().toISOString(),
        data: db,
      },
      null,
      2,
    ),
  );
}
function importData(data) {
  const next = normalize(data.database || data.data || data);
  if (
    !confirm(
      "استبدال بيانات النسخة الجديدة بالملف المحدد؟ احتفظ بنسخة احتياطية خارج المتصفح.",
    )
  )
    return;
  backup();
  commit(next);
  render();
  message("تم الاستيراد. راجع الأرصدة وكشف الحساب قبل اعتماد فواتير جديدة.");
}

    '<div class="actions"><button data-offline="print-doc">طباعة المستند</button><button data-offline="save-doc">حفظ المستند HTML</button><button class="secondary" data-offline="close-doc">رجوع</button></div><iframe title="المستند المستقل" sandbox="allow-modals allow-same-origin"></iframe>';
  document.body.append(dialog);
  dialog.querySelector("iframe").srcdoc = doc;
  dialog.showModal();
  dialog.savedDocument = doc;
}
document.addEventListener(
  "click",
  (e) => {
    const b = e.target.closest('[data-offline],[data-action="print"]');
    if (!b) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    attempt(() => {
      const action = b.dataset.offline;
      if (action === "save" || action === "save-header") savePhoneFile();
      if (action === "customer-edit" || action === "product-edit")
        masterForm(action, b.dataset.id);
      if (action === "capital")
        modal(
          "تمويل الصندوق",
          field(
            "المبلغ",
            "amount",
            "number",
            "",
            'min="0.01" step="0.01" required',
          ) +
            field("التاريخ", "date", "date", today(), "required") +
            field("البيان", "note", "text", "", "required"),
          "offline-capital",
        );
      if (b.dataset.action === "print") independentDocument();
      if (action === "close-doc")
        document.querySelector("#offline-document").close();
      if (action === "save-doc")
        download(
          "WIFI-HOME-document-" + Date.now() + ".html",
          document.querySelector("#offline-document").savedDocument,
          "text/html",
        );
      if (action === "print-doc") {
        const frame = document.querySelector("#offline-document iframe");
        if (typeof frame.contentWindow.print !== "function")
          throw Error(
            "المتصفح لا يدعم الطباعة؛ احفظ المستند وافتحه في متصفح يدعمها",
          );
        frame.contentWindow.focus();
        frame.contentWindow.print();
      }
    });
  },
  true,
);
document.addEventListener(
  "submit",
  (e) => {
    const form = e.target;
    if (form.id !== "modal-form" || !form.dataset.kind?.startsWith("offline-"))
      return;
    e.preventDefault();
    e.stopImmediatePropagation();
    try {
      const f = Object.fromEntries(new FormData(form)),
        next = normalize(db),
        kind = form.dataset.kind,
        id = form.dataset.extra;
      if (kind === "offline-capital") {
        dateCheck(next, f.date);
        const amount = Number(f.amount);
        if (!Number.isFinite(amount) || amount <= 0 || !f.note.trim())
          throw Error("أدخل مبلغاً وبياناً صالحين");
        const ref = "CAP-" + recordID();
        entry(next, ref, f.date, f.note, [
          { account: "الصندوق", debit: round(amount), credit: 0 },
          {
            account: "رأس المال والأرصدة الافتتاحية",
            debit: 0,
            credit: round(amount),
          },
        ]);
        audit(next, "تمويل الصندوق", ref, null, f, "");
      } else {
        if (!f.name.trim()) throw Error("أدخل الاسم");
        const item = (
            kind === "offline-customer-edit" ? next.customers : next.products
          ).find((x) => x.id === id),
          before = structuredClone(item);
        if (kind === "offline-customer-edit") {
          const limit = Number(f.limit);
          if (!Number.isFinite(limit) || limit < 0)
            throw Error("حد الائتمان غير صالح");
          Object.assign(item, {
            name: f.name.trim(),
            phone: f.phone,
            region: f.region,
            limit,
          });
        } else {
          const price = Number(f.price);
          if (!Number.isFinite(price) || price < 0)
            throw Error("السعر غير صالح");
          Object.assign(item, { name: f.name.trim(), price: round(price) });
        }
        audit(next, "تعديل بيانات أساسية", id, before, item, "");
      }
      commit(next);
      document.querySelector("#modal").close();
      render();
      message("تم الحفظ محلياً.");
    } catch (error) {
      document.querySelector("#modal-error").textContent = error.message;
    }
  },
  true,
);
render();

})();</script>
